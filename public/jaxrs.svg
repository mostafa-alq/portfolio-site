<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#0d1117"/>

  <!-- $ curl -X POST localhost:8080/api/rooms \ -->
  <text x="72"  y="52"  font-family="Monaco, Courier New, monospace" font-size="17" fill="#28c840">$</text>
  <text x="92"  y="52"  font-family="Monaco, Courier New, monospace" font-size="17" fill="#c9d1d9">curl</text>
  <text x="142" y="52"  font-family="Monaco, Courier New, monospace" font-size="17" fill="#8b949e">-X</text>
  <text x="172" y="52"  font-family="Monaco, Courier New, monospace" font-size="17" fill="#e3b341">POST</text>
  <text x="222" y="52"  font-family="Monaco, Courier New, monospace" font-size="17" fill="#79c0ff">localhost:8080/api/rooms</text>
  <text x="462" y="52"  font-family="Monaco, Courier New, monospace" font-size="17" fill="#8b949e"> \</text>

  <!-- >  -H "Content-Type: application/json" \ -->
  <text x="72"  y="84"  font-family="Monaco, Courier New, monospace" font-size="17" fill="#28c840">&gt;</text>
  <text x="102" y="84"  font-family="Monaco, Courier New, monospace" font-size="17" fill="#8b949e">-H</text>
  <text x="132" y="84"  font-family="Monaco, Courier New, monospace" font-size="17" fill="#7ee787">"Content-Type: application/json"</text>
  <text x="452" y="84"  font-family="Monaco, Courier New, monospace" font-size="17" fill="#8b949e"> \</text>

  <!-- >  -d '{"name":"Lab 101","capacity":30}' -->
  <text x="72"  y="116" font-family="Monaco, Courier New, monospace" font-size="17" fill="#28c840">&gt;</text>
  <text x="102" y="116" font-family="Monaco, Courier New, monospace" font-size="17" fill="#8b949e">-d</text>
  <text x="132" y="116" font-family="Monaco, Courier New, monospace" font-size="17" fill="#7ee787">'{"name":"Lab 101","capacity":30}'</text>

  <!-- HTTP/1.1 201 Created -->
  <text x="72"  y="172" font-family="Monaco, Courier New, monospace" font-size="17" fill="#8b949e">HTTP/1.1</text>
  <text x="164" y="172" font-family="Monaco, Courier New, monospace" font-size="17" fill="#3fb950">201 Created</text>

  <!-- Content-Type: application/json -->
  <text x="72"  y="204" font-family="Monaco, Courier New, monospace" font-size="17" fill="#8b949e">Content-Type: application/json</text>

  <!-- { -->
  <text x="72"  y="260" font-family="Monaco, Courier New, monospace" font-size="17" fill="#c9d1d9">{</text>

  <!-- "id": "room-a1b2c3", -->
  <text x="92"  y="292" font-family="Monaco, Courier New, monospace" font-size="17" fill="#79c0ff">"id"</text>
  <text x="132" y="292" font-family="Monaco, Courier New, monospace" font-size="17" fill="#c9d1d9">:</text>
  <text x="152" y="292" font-family="Monaco, Courier New, monospace" font-size="17" fill="#7ee787">"room-a1b2c3"</text>
  <text x="294" y="292" font-family="Monaco, Courier New, monospace" font-size="17" fill="#c9d1d9">,</text>

  <!-- "name": "Lab 101", -->
  <text x="92"  y="324" font-family="Monaco, Courier New, monospace" font-size="17" fill="#79c0ff">"name"</text>
  <text x="152" y="324" font-family="Monaco, Courier New, monospace" font-size="17" fill="#c9d1d9">:</text>
  <text x="172" y="324" font-family="Monaco, Courier New, monospace" font-size="17" fill="#7ee787">"Lab 101"</text>
  <text x="264" y="324" font-family="Monaco, Courier New, monospace" font-size="17" fill="#c9d1d9">,</text>

  <!-- "_links": { -->
  <text x="92"  y="356" font-family="Monaco, Courier New, monospace" font-size="17" fill="#79c0ff">"_links"</text>
  <text x="172" y="356" font-family="Monaco, Courier New, monospace" font-size="17" fill="#c9d1d9">: {</text>

  <!-- "self": "/api/rooms/room-a1b2c3" -->
  <text x="112" y="388" font-family="Monaco, Courier New, monospace" font-size="17" fill="#79c0ff">"self"</text>
  <text x="172" y="388" font-family="Monaco, Courier New, monospace" font-size="17" fill="#c9d1d9">:</text>
  <text x="192" y="388" font-family="Monaco, Courier New, monospace" font-size="17" fill="#7ee787">"/api/rooms/room-a1b2c3"</text>

  <!-- } -->
  <text x="92"  y="420" font-family="Monaco, Courier New, monospace" font-size="17" fill="#c9d1d9">}</text>

  <!-- } -->
  <text x="72"  y="452" font-family="Monaco, Courier New, monospace" font-size="17" fill="#c9d1d9">}</text>
</svg>
